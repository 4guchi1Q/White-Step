(function(){

<script type="module">
const D=window.wsDebug;
async function boot(){
const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js');
D.mark('Three.js loaded r'+THREE.REVISION);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(74,innerWidth/innerHeight,.045,125);

scene.add(new THREE.HemisphereLight(0xf1f6ff,0x657082,2.1));
const sunlight = new THREE.DirectionalLight(0xffe9c8,2.1);
sunlight.position.set(-6,16,11);sunlight.castShadow=true;scene.add(sunlight);
const material = hex => new THREE.MeshStandardMaterial({color:hex,roughness:.89});
const asphalt=material(0x373c42),stripe=material(0xf2f1e9),concrete=material(0x9c9d96);
const sidewalk=material(0x999b9d),darkWall=material(0x747e82),windowMat=material(0x354b63);
const black=material(0x151a22),trousers=material(0x303c4e),jacket=material(0x28364a);
const shirt=material(0xe6e9e7),tie=material(0x822b39),skin=material(0xc8a087);
function block(w,h,d,mat,x,y,z,cast=false){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  mesh.position.set(x,y,z);mesh.receiveShadow=true;mesh.castShadow=cast;scene.add(mesh);return mesh;
}
// One continuous commute: near curb -> five white crosswalk stripes -> far curb -> office.
// The road is visual-only; these exact painted regions have foot support.
const STRIPE_HALF=.135, FAR_X=4.25, WALL_FACE=-1.65, FAR_WALL_FACE=5.90;
const CROSS_Z=-7.1,CROSS_HALF_Z=.76,CROSS_XS=[.57,1.35,2.13,2.91,3.69];
const CHECKPOINT_Z=-12.4,GOAL_Z=-26.0;
function safePaint(p){
  const nearLine=Math.abs(p.x)<=STRIPE_HALF&&p.z>=-34&&p.z<=5;
  const farLine=Math.abs(p.x-FAR_X)<=STRIPE_HALF&&p.z<=5&&p.z>=-34;
  const crosswalk=Math.abs(p.z-CROSS_Z)<=CROSS_HALF_Z&&CROSS_XS.some(x=>Math.abs(p.x-x)<=.21);
  return nearLine||farLine||crosswalk;
}
block(4.72,.06,39,asphalt,2.12,-.064,-14.5);
block(.27,.018,39,stripe,0,.015,-14.5);
block(.27,.018,39,stripe,FAR_X,.015,-14.5);
for(const x of CROSS_XS)block(.42,.018,CROSS_HALF_Z*2,stripe,x,.018,CROSS_Z);
block(1.40,.13,39,sidewalk,-.95,-.006,-14.5);
block(1.40,.13,39,sidewalk,5.20,-.006,-14.5);
block(.09,.12,39,concrete,-.25,.012,-14.5);
block(.09,.12,39,concrete,4.49,.012,-14.5);
for(let i=0;i<7;i++){
  const z=1.5-i*5.5;
  const houseMat=material(i%3===0?0x9da9ae:i%3===1?0xc0b2a4:0x9aa7a1);
  const height=3.6+(i%3)*.6;
  block(.22,1.43,5.4,i%3?concrete:darkWall,-1.76,.71,z,true);
  block(3.1,height,4.75,houseMat,-3.52,height/2-.05,z,true);
  block(.09,.64,.92,windowMat,-1.95,1.3,z-.85);
  block(.22,1.35,5.4,concrete,6.01,.67,z,true);
  block(3.2,4.15,4.7,material(i%2?0xc7b8ab:0xa6b5bb),7.92,2.02,z,true);
  block(.09,.65,.92,windowMat,6.31,1.4,z+.6);
}
// A distinct office beyond the checkpoint; there are no separate scene loads.
const office=material(0x788d9e);
block(4.35,7,5.5,office,7.48,3.48,-27.1,true);
for(let floor=0;floor<4;floor++){
  block(.07,.87,2.5,windowMat,5.28,1.15+floor*1.48,-27.1);
}
D.mark('Road and houses built');
const signCanvas=document.createElement('canvas');
signCanvas.width=512;signCanvas.height=128;
const signCtx=signCanvas.getContext('2d');
signCtx.fillStyle='#172b3b';signCtx.fillRect(0,0,512,128);
signCtx.fillStyle='#ffffff';signCtx.font='bold 64px sans-serif';
signCtx.textAlign='center';signCtx.textBaseline='middle';signCtx.fillText('会社・退職届受付',256,64);
const officeSign=new THREE.Mesh(new THREE.PlaneGeometry(2.6,.65),
  new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(signCanvas),side:THREE.DoubleSide}));
officeSign.position.set(5.27,2.65,-27.1);officeSign.rotation.y=-Math.PI/2;scene.add(officeSign);
// Checkpoint is a marker on the SAME white line, not a level transition.
const checkpointMark=new THREE.Mesh(new THREE.TorusGeometry(.31,.042,8,32),
  new THREE.MeshBasicMaterial({color:0x47d9ee}));
checkpointMark.rotation.x=-Math.PI/2;checkpointMark.position.set(FAR_X,.068,CHECKPOINT_Z);
scene.add(checkpointMark);
const goalMark=new THREE.Mesh(new THREE.TorusGeometry(.37,.055,8,36),
  new THREE.MeshBasicMaterial({color:0xffdf6d}));
goalMark.rotation.x=-Math.PI/2;goalMark.position.set(FAR_X,.073,GOAL_Z);
scene.add(goalMark);
// Traffic lights are linked: vehicles stop before the crossing on pedestrian green.
function lamp(x,y,z,color){
  const m=new THREE.MeshStandardMaterial({color:0x202a32,emissive:color,emissiveIntensity:.08});
  const orb=new THREE.Mesh(new THREE.SphereGeometry(.105,12,10),m);
  orb.position.set(x,y,z);scene.add(orb);return m;
}
function signal(x,z,angle,ped){
 const h=ped?2.35:4.65; const group=new THREE.Group();group.position.set(x,0,z);group.rotation.y=angle;scene.add(group);
 function part(w,h,d,x,y,z,mat){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);group.add(m);return m;}
 part(.12,h,.12,0,h/2,0,darkWall);
 const offset=ped?0:1.15;
 if(!ped)part(2.3,.10,.10,offset,h,0,darkWall);
 part(ped?.32:.92,ped?.58:.32,.22,offset,h,0,black);
 return (ped?[0xff2525,0x27ed85]:[0xff2525,0xffc42b,0x27ed85]).map((c,i)=>{const m=new THREE.MeshStandardMaterial({color:0x303030,emissive:c,emissiveIntensity:.04});const o=new THREE.Mesh(new THREE.SphereGeometry(.105,16,12),m);o.position.set(offset+(ped?0:(1-i)*.28),h+(ped?(.14-i*.28):0),.13);group.add(o);return m;});
}
D.mark('Office and checkpoint built');
const pedSignals=[signal(4.65,CROSS_Z,-Math.PI/2,true),signal(-.40,CROSS_Z,Math.PI/2,true)];
const carSignals=[signal(-.42,-8.65,0,false),signal(4.67,-5.55,Math.PI,false)];
function makeCar(x,z,hex,dir,speed){
  const root=new THREE.Group();scene.add(root);
  const bodyMat=material(hex),glass=material(0x344f69),rubber=material(0x15181f);
  const body=new THREE.Mesh(new THREE.BoxGeometry(.79,.35,1.52),bodyMat);
  body.position.y=.33;body.castShadow=true;root.add(body);
  const cabin=new THREE.Mesh(new THREE.BoxGeometry(.62,.36,.82),glass);
  cabin.position.set(0,.67,-.02);cabin.castShadow=true;root.add(cabin);
  for(const xx of [-.4,.4])for(const zz of [-.52,.52]){
    const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.16,.16,.085,12),rubber);
    wheel.rotation.z=Math.PI/2;wheel.position.set(xx,.16,zz);root.add(wheel);
  }
  root.scale.set(2.05,2.05,2.65);root.rotation.y=dir>0?Math.PI:0;root.position.set(x,0,z);
  return {root,x,z,origin:z,dir,speed};
}
const cars=[makeCar(1.13,3.4,0xc74b42,-1,2.4),makeCar(3.12,-29,0x476fbb,1,2.1)];
// Two solid, separately hittable shoes. Height differences allow one foot to swing over another.
D.mark('Traffic built');
const footModels=[],shoeMats=[];
for(let i=0;i<2;i++){
  const foot=new THREE.Group();
  const shoeMat=new THREE.MeshStandardMaterial({color:0x161a22,roughness:.7,emissive:0x000000});
  shoeMats.push(shoeMat);
  const sole=new THREE.Mesh(new THREE.BoxGeometry(.17,.11,.28),shoeMat);
  sole.position.z=-.055;sole.castShadow=true;foot.add(sole);
  const toe=new THREE.Mesh(new THREE.SphereGeometry(.087,14,10),shoeMat);
  toe.scale.set(1,.65,1.04);toe.position.set(0,0,-.20);foot.add(toe);
  const indicator=new THREE.Mesh(new THREE.BoxGeometry(.215,.015,.39),new THREE.MeshBasicMaterial({color:0x78ddff,transparent:true,opacity:.48,depthWrite:false}));
  indicator.position.set(0,-.069,-.096);indicator.visible=false;foot.add(indicator);
  scene.add(foot);footModels.push({root:foot,indicator});
}
const limbs=Array.from({length:2},()=>[0,1].map(part=>{
  const mesh=new THREE.Mesh(new THREE.CylinderGeometry(part?.083:.111,part?.073:.084,1,10),trousers);
  mesh.castShadow=true;scene.add(mesh);return mesh;
}));
function alignLimb(mesh,top,bottom){
  const delta=bottom.clone().sub(top);
  mesh.position.copy(top).add(bottom).multiplyScalar(.5);
  mesh.scale.set(1,delta.length(),1);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),delta.normalize());
}
// The upper body reacts automatically to the legs; it cannot be controlled directly.
// In foot-view mode, render only the legs to avoid covering the selectable shoes.
const torsoPivot=new THREE.Group();scene.add(torsoPivot);
const torsoOccluders=[];
function suitPart(w,h,d,mat,x,y,z){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  mesh.position.set(x,y,z);mesh.castShadow=true;torsoPivot.add(mesh);
  torsoOccluders.push(mesh);
  return mesh;
}
suitPart(.39,.18,.23,trousers,0,.06,0);
suitPart(.46,.54,.25,jacket,0,.38,0);
suitPart(.15,.42,.021,shirt,0,.38,-.136);
suitPart(.05,.34,.024,tie,0,.37,-.155);
suitPart(.14,.42,.16,jacket,-.31,.32,0);
suitPart(.14,.42,.16,jacket,.31,.32,0);
suitPart(.105,.105,.12,skin,-.31,.06,-.008);
suitPart(.105,.105,.12,skin,.31,.06,-.008);
// A physical neck and head are attached to the body. The camera sits at the eyes,
// rather than floating behind the chest as it did in the previous prototype.
const neck=new THREE.Mesh(new THREE.CylinderGeometry(.080,.094,.19,14),skin);
neck.position.set(0,.73,-.045);neck.castShadow=true;torsoPivot.add(neck);
const headGroup=new THREE.Group();
headGroup.position.set(0,.89,-.06);
torsoPivot.add(headGroup);
const headMesh=new THREE.Mesh(new THREE.SphereGeometry(.17,18,14),skin);
headMesh.scale.set(.96,1.13,1);
headMesh.castShadow=true;headGroup.add(headMesh);
const hair=new THREE.Mesh(new THREE.SphereGeometry(.171,18,10,0,Math.PI*2,0,Math.PI*.42),material(0x23252c));
hair.position.y=.035;headGroup.add(hair);
const eyeAnchor=new THREE.Object3D();
eyeAnchor.position.set(0,.035,-.18);
headGroup.add(eyeAnchor);
// Don't draw the player's own head/neck into the eye camera: it would obscure vision.
neck.layers.set(1);headMesh.layers.set(1);hair.layers.set(1);

D.mark('Player model built');
const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();
const plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
const hitPoint=new THREE.Vector3();
const status=document.getElementById('status');
let footYaw=[0,0],bodyYaw=0,impact=0;
let feet,selected,dragging,dragStart,dragSpeed,session;
let balance,collapseTime,fallOffset,fallVelocity,ended,isWin,overlayDelay,progress;
let leanX,leanZ,wallContactTime,wallAssist;
let checkpointReached=false,checkpointFeet=null,pedestrianGreen=false,trafficGreen=true;
let yaw=0,pitch=-1.31,lastFrame=performance.now(),elapsed=0,initialFrame=true;
function hip(){
  return new THREE.Vector3((feet[0].x+feet[1].x)/2,1.00,(feet[0].z+feet[1].z)/2+.13);
}
function reset(fromCheckpoint=false){
  const resume=fromCheckpoint===true&&checkpointReached&&checkpointFeet;
  feet=resume?checkpointFeet.map(f=>f.clone()):
    [new THREE.Vector3(-.075,.09,.11),new THREE.Vector3(.075,.09,.56)];
  if(!resume){checkpointReached=false;checkpointFeet=null}
  footYaw=[0,0];bodyYaw=0;impact=0;selected=-1;dragging=false;dragStart=null;dragSpeed=0;session=null;
  balance=100;collapseTime=0;fallOffset=0;fallVelocity=0;ended=false;isWin=false;overlayDelay=0;
  progress=Math.max(0,-Math.min(feet[0].z,feet[1].z));
  leanX=0;leanZ=0;wallContactTime=0;wallAssist=0;elapsed=0;
  for(const car of cars){car.z=car.origin;car.root.position.z=car.z}
  document.getElementById('checkpointStatus').textContent='CHECKPOINT：'+(checkpointReached?'到達済み':'未到達');
  yaw=0;pitch=-1.31;initialFrame=true;lastFrame=performance.now();
  document.getElementById('message').style.display='none';
  status.textContent=resume?'チェックポイントから再開！ 好きな足を選ぼう':'好きな足をタップして出勤開始！';
}
function showResult(win,reason){
  if(ended)return;
  ended=true;dragging=false;selected=-1;session=null;isWin=win;
  document.getElementById('result').textContent=win?'PROTOTYPE CLEAR':'GAME OVER';
  document.getElementById('reason').textContent=reason;
}
function setPointer(e){
  pointer.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(pointer,camera);
}
function groundPosition(e){
  setPointer(e);
  return ray.ray.intersectPlane(plane,hitPoint)?hitPoint.clone():null;
}
function tappedFoot(e){
  setPointer(e);
  const hits=ray.intersectObjects(footModels.map(f=>f.root),true);
  if(hits.length){
    const i=footModels.findIndex(f=>f.root===hits[0].object.parent);
    if(i>=0)return i;
  }
  // Slightly larger tap targets for phones and high-DPI displays.
  let nearest=-1,best=innerWidth<620?62:45;
  for(let i=0;i<2;i++){
    const projected=feet[i].clone().add(new THREE.Vector3(0,.08,-.10)).project(camera);
    if(projected.z>1||projected.z< -1)continue;
    const px=(projected.x+1)*innerWidth/2,py=(1-projected.y)*innerHeight/2;
    const d=Math.hypot(px-e.clientX,py-e.clientY);
    if(d<best){nearest=i;best=d}
  }
  return nearest;
}
// Collision uses the full footprint of the two shoes rather than center points.
function shoeRect(p,angle){const c=Math.cos(angle),s=Math.sin(angle);return [[-.085,-.29],[.085,-.29],[.085,.085],[-.085,.085]].map(([x,z])=>({x:p.x+c*x+s*z,z:p.z-s*x+c*z}));}
function feetCollide(a,b){const ia=feet.indexOf(a),ib=feet.indexOf(b);const aa=footYaw[ia<0?selected:ia]||0,bb=footYaw[ib<0?1-selected:ib]||0;const A=shoeRect(a,aa),B=shoeRect(b,bb);return [aa,aa+Math.PI/2,bb,bb+Math.PI/2].every(t=>{const proj=P=>P.map(p=>p.x*Math.cos(t)+p.z*Math.sin(t));const x=proj(A),y=proj(B);return Math.max(...x)>Math.min(...y)+.002&&Math.max(...y)>Math.min(...x)+.002;});}
function support(p,i){let n=0,total=0;const a=footYaw[i],c=Math.cos(a),s=Math.sin(a);for(let x=-.08;x<=.081;x+=.02)for(let z=-.28;z<=.081;z+=.02){total++;if(safePaint({x:p.x+c*x+s*z,z:p.z-s*x+c*z}))n++;}return n/total;}
function resetSelection(){
  if(selected>=0){
    if(dragging&&dragStart){feet[selected].copy(dragStart);if(session)footYaw[selected]=session.startYaw;}
    feet[selected].y=.09;
  }
  selected=-1;dragging=false;dragStart=null;dragSpeed=0;
  status.textContent='足の選択を解除。画面ドラッグで視点移動';
}
function onPointerDown(e){
  if(ended||session)return;
  const hit=tappedFoot(e);
  const ground=selected>=0?groundPosition(e):null;
  session={id:e.pointerId,startX:e.clientX,startY:e.clientY,lastX:e.clientX,lastY:e.clientY,hit,moved:false,
    startYaw:selected>=0?footYaw[selected]:0,startGround:ground,startFoot:selected>=0?feet[selected].clone():null};
  renderer.domElement.setPointerCapture(e.pointerId);
}
function onPointerMove(e){
  if(!session||e.pointerId!==session.id||ended)return;
  const dx=e.clientX-session.lastX,dy=e.clientY-session.lastY;
  session.lastX=e.clientX;session.lastY=e.clientY;
  if(Math.hypot(e.clientX-session.startX,e.clientY-session.startY)>8)session.moved=true;
  if(selected<0){
    if(session.moved){
      yaw-=dx*.0048;
      pitch=clamp(pitch-dy*.0047,-1.54,.6);
    }
    return;
  }
  if(!session.moved)return;
  if(!dragging){dragging=true;dragStart=feet[selected].clone()}
  const p=groundPosition(e);if(!p||!session.startGround)return;
  const start=session.startFoot,anchor=feet[1-selected];
  let wantedX=start.x+p.x-session.startGround.x;
  let wantedZ=start.z+p.z-session.startGround.z;
  const offX=wantedX-anchor.x,offZ=wantedZ-anchor.z;
  const reach=Math.min(1,1.08/Math.max(.001,Math.hypot(offX,offZ)));
  feet[selected].set(anchor.x+offX*reach,.30,anchor.z+offZ*reach);
  footYaw[selected]=-yaw;
  dragSpeed=clamp(dragSpeed*.55+Math.hypot(dx,dy)/95,0,1.8);
  if(feetCollide(feet[selected],anchor)){
    status.textContent='足同士が重なっている！ この位置には着地できない';
  }else{
    status.textContent='白線上に着地させよう';
  }
}
function onPointerUp(e,cancel=false){
  if(!session||e.pointerId!==session.id)return;
  const s=session;session=null;
  if(ended)return;
  if(selected<0){
    if(!cancel&&!s.moved){
      if(s.hit>=0){
        selected=s.hit;status.textContent=(selected===0?'左足':'右足')+'を選択中。好きな順番で歩けるよ！';
      }
    }
    return;
  }
  if(cancel){resetSelection();return}
  if(!s.moved){
    if(s.hit===selected)resetSelection();
    return;
  }
  const f=feet[selected],anchor=feet[1-selected];
  dragging=false;f.y=.09;dragSpeed*=.3;
  if(feetCollide(f,anchor)){
    f.copy(s.startFoot);footYaw[selected]=s.startYaw;
    status.textContent='足がぶつかるため着地できない。もう一度ドラッグしてね';
    return;
  }
  // Unsupported feet do not cause instant death; balance and remaining support decide.
  progress=Math.max(progress,-Math.min(feet[0].z,feet[1].z));
  bodyYaw=footYaw[selected];selected=-1;dragStart=null;
  if(!checkpointReached&&feet.every(p=>Math.abs(p.x-FAR_X)<.19&&p.z<CHECKPOINT_Z+.45)){
    checkpointReached=true;checkpointFeet=feet.map(p=>p.clone());
    document.getElementById('checkpointStatus').textContent='CHECKPOINT：到達済み';
    status.textContent='チェックポイント通過！ ここから再挑戦できる';
  }else status.textContent='左右どちらの足でも選べる。姿勢が良くなるとバランス回復';
  if(feet.every(p=>Math.abs(p.x-FAR_X)<.19&&p.z<=GOAL_Z)){
    showResult(true,'会社に到着！ 辞表を提出して退職成功！');return;
  }
}
renderer.domElement.addEventListener('pointerdown',onPointerDown);
renderer.domElement.addEventListener('pointermove',onPointerMove);
renderer.domElement.addEventListener('pointerup',onPointerUp);
renderer.domElement.addEventListener('pointercancel',e=>onPointerUp(e,true));
document.getElementById('front').onclick=()=>{
  if(ended)return;yaw=-bodyYaw;pitch=-.06;
  status.textContent=selected>=0?'足を選択中。足元に戻ると操作しやすいよ':'前方を確認中。ドラッグで自由に見回せる';
};
document.getElementById('down').onclick=()=>{
  if(ended)return;pitch=-1.31;
  status.textContent=selected>=0?'足をドラッグして着地させよう':'足をタップして選択しよう';
};
document.getElementById('reset').onclick=()=>reset(false);
document.getElementById('retry').onclick=()=>reset(true);
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
});
function updateTorso(dt){
  const base=hip();
  const support=dragging?feet[1-selected]:feet[0].clone().add(feet[1]).multiplyScalar(.5);
  const side=base.x-support.x,depth=base.z-support.z;
  const danger=clamp((55-balance)/55,0,1);
  // Lean naturally in response to displaced support; severe imbalance adds a delayed tip.
  const sideGoal=clamp(side*2.45+Math.sign(side)*danger*.45,-1.05,1.05);
  const depthGoal=clamp(depth*1.7+Math.sign(depth)*danger*.22,-.78,.78);
  leanX+=(sideGoal-leanX)*Math.min(1,dt*3.5);
  leanZ+=(depthGoal-leanZ)*Math.min(1,dt*3.1);
  const leftShoulderX=base.x+Math.sin(leanX*.92)*.64-.23;
  const rightShoulderX=base.x+Math.sin(leanX*.92)*.64+.23;
  const touchingLeft=leftShoulderX<WALL_FACE;
  const touchingRight=rightShoulderX>FAR_WALL_FACE;
  if(touchingLeft){
    const rollLimit=Math.asin(clamp((WALL_FACE+.23-base.x)/.64,-1,1))/.92;
    leanX=Math.max(leanX,rollLimit);
  }else if(touchingRight){
    const rollLimit=Math.asin(clamp((FAR_WALL_FACE-.23-base.x)/.64,-1,1))/.92;
    leanX=Math.min(leanX,rollLimit);
  }
  wallContactTime=touchingLeft||touchingRight?wallContactTime+dt:0;
  wallAssist=wallContactTime>0&&wallContactTime<.60?14:0;
  return base;
}
function targetBalance(){
  const base=hip();
  const support=dragging?feet[1-selected]:feet[0].clone().add(feet[1]).multiplyScalar(.5);
  const comX=base.x+leanX*.40,comZ=base.z+leanZ*.40;
  const lateral=Math.abs(comX-support.x),depth=Math.abs(comZ-support.z);
  const span=Math.hypot(feet[0].x-feet[1].x,feet[0].z-feet[1].z);
  // Sideways crosswalk steps need to be difficult but physically possible.
  const penaltyX=Math.max(0,lateral-.04)/(dragging?.29:.16)*28;
  const penaltyZ=Math.max(0,depth-.085)/(dragging?.26:.48)*29;
  const stride=Math.max(0,span-.57)*(dragging?43:30);
  const crossed=(feet[0].x-feet[1].x)*Math.cos(bodyYaw)-(feet[0].z-feet[1].z)*Math.sin(bodyYaw)>.12?20:0;
  const movement=dragging?dragSpeed*10+7:0;
  const leanPenalty=Math.max(0,Math.hypot(leanX,leanZ)-.5)*20;
  const contact=feet.map((p,i)=>dragging&&i===selected?0:support(p,i));
  const supportPenalty=Math.max(...contact)===0?120:contact.filter((v,i)=>!(dragging&&i===selected)).reduce((a,v)=>a+Math.max(0,.45-v)*55,0);
  return {target:clamp(100-supportPenalty-impact-penaltyX-penaltyZ-stride-crossed-movement-leanPenalty+wallAssist,0,100),comX,comZ};
}
function updateBalance(dt){
  if(ended)return;
  impact=Math.max(0,impact-dt*35);
  const state=targetBalance();
  if(!feet.some((p,i)=>!(dragging&&i===selected)&&support(p,i)>0)){showResult(false,"足場を失った");return;}
  balance+=(state.target-balance)*Math.min(1,dt*(state.target>balance?7.6:5.8));
  if(balance<16)collapseTime+=dt*(wallAssist? .55:1);
  else collapseTime=Math.max(0,collapseTime-dt*2.5);
  if(collapseTime>.75){
    showResult(false,'重心が足場を外れ、転倒した！');return;
  }
  if(dragging&&balance<32){
    const planted=feet[1-selected],slip=dt*(32-balance)/32*.12;
    planted.x+=(state.comX-planted.x)*slip;
    planted.z+=(state.comZ-planted.z)*slip;
    
  }
}
function updateTraffic(dt){
  const phase=elapsed%30;
  pedestrianGreen=phase>=12&&phase<28;
  trafficGreen=phase<11;
  const yellow=phase>=9&&phase<12;trafficGreen=phase<9;
  for(const [r,g] of pedSignals){r.emissiveIntensity=pedestrianGreen?.04:2;g.emissiveIntensity=pedestrianGreen?2:.04;}
  for(const [r,y,g] of carSignals){r.emissiveIntensity=!trafficGreen&&!yellow?2:.04;y.emissiveIntensity=yellow?2:.04;g.emissiveIntensity=trafficGreen?2:.04;}
  document.getElementById('pedText').textContent=pedestrianGreen?'青':'赤';
  document.getElementById('pedText').style.color=pedestrianGreen?'#74f4b3':'#ff7c7c';
  document.getElementById('carText').textContent=trafficGreen?'青':'赤';
  document.getElementById('carText').style.color=trafficGreen?'#74f4b3':'#ff7c7c';
  const body=hip();
  for(const car of cars){
    const next=car.z+car.dir*car.speed*dt;
    // Cars approach from opposite directions and stop BEFORE the crosswalk.
    if(!trafficGreen&&car.dir<0&&car.z>=-3.55){
      car.z=Math.max(-3.55,next);
    }else if(!trafficGreen&&car.dir>0&&car.z<=-10.65){
      car.z=Math.min(-10.65,next);
    }else car.z=next;
    if(car.dir<0&&car.z< -30)car.z=4.5;
    if(car.dir>0&&car.z>5.8)car.z=-30;
    car.root.position.set(car.x,0,car.z);
    if(!ended&&Math.abs(body.x-car.x)<1.02&&Math.abs(body.z-car.z)<2.22){
      const push=car.dir*Math.min(.12,dt*car.speed);impact=Math.min(85,impact+dt*95);
      for(const f of feet)f.z+=push;
      leanZ=clamp(leanZ+push*2,-.9,.9);
    }
  }
  checkpointMark.material.color.setHex(checkpointReached?0x78ffa6:0x47d9ee);
  checkpointMark.rotation.z+=dt*.5;
}
function animate(now){
 try {
  const dt=clamp((now-lastFrame)/1000||1/60,.001,.05);
  lastFrame=now;elapsed+=dt;
  dragSpeed*=Math.pow(.79,dt*60);
  if(!ended){updateTraffic(dt);updateTorso(dt);updateBalance(dt)}
  else if(!isWin){
    fallVelocity+=9.8*dt;fallOffset-=fallVelocity*dt;
  }
  if(ended){
    overlayDelay+=dt;
    if(overlayDelay>.85)document.getElementById('message').style.display='flex';
  }
  const base=hip();
  torsoPivot.position.set(base.x,.94+fallOffset,base.z);
  torsoPivot.rotation.set(leanZ*.92,bodyYaw,-leanX*.92);
  torsoPivot.updateMatrixWorld(true);
  const eyes=eyeAnchor.getWorldPosition(new THREE.Vector3());
  eyes.x=clamp(eyes.x,WALL_FACE+.2,FAR_WALL_FACE-.2);
  if(initialFrame){camera.position.copy(eyes);initialFrame=false}
  else camera.position.lerp(eyes,Math.min(1,dt*11));
  // See-through upper body when looking down: feet and shoe hit targets stay visible.
  const footView=pitch<-.90;
  torsoOccluders.forEach(mesh=>{mesh.visible=!footView});
  const direction=new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch));
  camera.lookAt(camera.position.clone().add(direction));
  // Keep legs attached to the feet and hips (including while falling).
  for(let i=0;i<2;i++){
    const foot=feet[i].clone();foot.y+=fallOffset;
    footModels[i].root.position.copy(foot);footModels[i].root.rotation.y=footYaw[i];
    const high=selected===i;
    const suggested=false;
    const blocked=high&&feetCollide(feet[i],feet[1-i]);
    const color=blocked?0xff5c5c:high?0x45ddff:0x86f3a5;
    shoeMats[i].emissive.setHex(high?color:0);
    shoeMats[i].emissiveIntensity=high?.66:0;
    footModels[i].indicator.visible=high||suggested;
    footModels[i].indicator.material.color.setHex(color);
    footModels[i].indicator.material.opacity=high?.48:.28;
    const top=new THREE.Vector3(base.x+(i?.105:-.105),.97+fallOffset,base.z);
    const knee=new THREE.Vector3(top.x*.53+foot.x*.47+(i?.04:-.04),.53+fallOffset,top.z*.55+foot.z*.45-.04);
    const ankle=foot.clone();ankle.y+=.12;
    alignLimb(limbs[i][0],top,knee);
    alignLimb(limbs[i][1],knee,ankle);
  }
  const p=Math.round(balance);
  document.getElementById('balanceText').textContent=p+'%';
  const fill=document.getElementById('fill');
  fill.style.width=p+'%';
  fill.style.background=p<35?'#ef6a6a':p<65?'#e9bc61':'#6bddab';
  document.getElementById('posture').textContent=wallAssist>0?'重心：壁に接触中':p>75?'重心：安定':p>35?'重心：不安定':'重心：転倒の危険！';
  document.getElementById('distance').textContent='進行距離 '+progress.toFixed(1)+'m / 26m';
  renderer.render(scene,camera);
  D.frame();
  requestAnimationFrame(animate);
 } catch(e){D.fail(e);}
}
document.addEventListener("contextmenu",e=>e.preventDefault());document.addEventListener("selectstart",e=>e.preventDefault());
D.mark('Starting reset');
reset();
D.mark("Reset OK; waiting for first frame");
requestAnimationFrame(animate);
}
boot().catch(e=>D.fail(e));
</script>
