<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>WHITE STEP | Prototype</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#10151b;color:#fff;font-family:system-ui,sans-serif}canvas{display:block;touch-action:none}#hud{position:fixed;top:16px;left:16px;pointer-events:none;text-shadow:0 2px 6px #000}#hud h1{font-size:23px;letter-spacing:.2em;margin:0 0 8px}#bar{height:10px;width:190px;background:#34383e;border-radius:10px;overflow:hidden;margin-top:5px}#fill{height:100%;background:#69dfaa;width:100%;transition:width .08s}#hint{font-size:12px;line-height:1.8;opacity:.85;margin-top:9px}#controls{position:fixed;right:16px;top:16px;display:flex;gap:8px}button{border:1px solid #ffffff66;background:#18212cd9;color:#fff;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer}#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#05080dbd;text-align:center}#panel{background:#151c27;border:1px solid #ffffff33;border-radius:18px;padding:28px;max-width:350px;width:85%}#panel h2{font-size:30px;letter-spacing:.12em}#footBtns{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:10px}#footBtns button.active{background:#e4f4ff;color:#15212b}#status{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:#10151baa;border-radius:9px;padding:8px 12px;font-size:13px;white-space:nowrap;pointer-events:none}@media(max-width:600px){#hud h1{font-size:17px}#hint{max-width:190px}#controls{top:12px;right:10px}button{padding:10px}#footBtns{bottom:12px}}
</style></head><body><div id="hud"><h1>WHITE STEP</h1><div>バランス <span id="balanceText">100%</span></div><div id="bar"><div id="fill"></div></div><div id="hint">足をドラッグして白線上に置こう。<br>片足ずつ交互に操作。<br>右上で前方視点に切替。</div><div id="distance">進行距離 0.0m / 12m</div></div><div id="controls"><button id="view">前方を見る</button><button id="reset">やり直す</button></div><div id="status">左足をドラッグして一歩踏み出そう</div><div id="footBtns"><button id="left" class="active">左足</button><button id="right">右足</button></div><div id="msg"><div id="panel"><h2 id="result">GAME OVER</h2><p id="reason"></p><button id="retry">RETRY</button></div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xa9c3d4);scene.fog=new THREE.Fog(0xa9c3d4,20,90);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,120);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe5f5ff,0x536078,2));const sun=new THREE.DirectionalLight(0xfff2da,2.2);sun.position.set(-8,16,12);sun.castShadow=true;scene.add(sun);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.88});const asphalt=mat(0x383d43),white=mat(0xf1eee5),shoeMat=mat(0x16191f),pant=mat(0x333b49);
function box(w,h,d,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.receiveShadow=true;scene.add(o);return o}
// Road is VISUAL ONLY. Only the white stripe is collidable.
box(13,.04,75,asphalt,0,-.045,-22);box(.27,.018,40,white,0,.005,-18);for(let i=0;i<14;i++){let z=3-i*5;box(3,.15,4,mat(i%2?0x8a969b:0x9faab0),-8,-.09,z);box(3,.15,4,mat(i%2?0x8a969b:0x9faab0),8,-.09,z)}
for(let i=0;i<12;i++){let z=-i*6-3;let h=4+(i%4)*1.4;box(4,h,4,mat(i%2?0x8196a4:0xa5adb5),-10,h/2-.1,z);box(4,h+1,4,mat(i%2?0x8b9199:0xb5aaa0),10,(h+1)/2-.1,z)}
const footMeshes=[];for(let i=0;i<2;i++){let root=new THREE.Group();const shoe=new THREE.Mesh(new THREE.BoxGeometry(.19,.12,.38),shoeMat);shoe.position.z=-.08;shoe.castShadow=true;root.add(shoe);const toe=new THREE.Mesh(new THREE.SphereGeometry(.096,10,8),shoeMat);toe.scale.set(1,.6,1.2);toe.position.set(0,0,-.26);root.add(toe);scene.add(root);footMeshes.push(root)}
const legs=[];for(let i=0;i<2;i++){let leg=new THREE.Mesh(new THREE.CylinderGeometry(.105,.075,1,10),pant);scene.add(leg);legs.push(leg)}
let feet,active,dragging=false,look=false,ended=false,stability=100,fallY=0,velocity=0,progress=0,prevX=0,prevY=0,dragSpeed=0;const ray=new THREE.Raycaster();const pointer=new THREE.Vector2();const ground=new THREE.Plane(new THREE.Vector3(0,1,0),-.0);const target=new THREE.Vector3();let startFoot=null;
const status=document.getElementById('status');function reset(){feet=[new THREE.Vector3(-.075,.09,.25),new THREE.Vector3(.075,.09,.55)];active=0;dragging=false;look=false;ended=false;stability=100;fallY=0;velocity=0;progress=0;document.getElementById('msg').style.display='none';document.getElementById('view').textContent='前方を見る';updateButtons()}
function updateButtons(){document.getElementById('left').classList.toggle('active',active===0);document.getElementById('right').classList.toggle('active',active===1)}
function finish(win,why){ended=true;dragging=false;document.getElementById('msg').style.display='flex';document.getElementById('result').textContent=win?'PROTOTYPE CLEAR':'GAME OVER';document.getElementById('reason').textContent=why}
function worldAt(e){pointer.x=e.clientX/innerWidth*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(pointer,camera);return ray.ray.intersectPlane(ground,target)?target.clone():null}
function onDown(e){if(ended||look)return;const p=worldAt(e);if(!p)return;const f=feet[active];if(Math.hypot(p.x-f.x,p.z-f.z)>.9)return;dragging=true;startFoot=f.clone();dragSpeed=0;prevX=e.clientX;prevY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)}
function onMove(e){if(!dragging||ended)return;const p=worldAt(e);if(!p)return;const f=feet[active],anchor=feet[1-active];const dx=p.x-anchor.x,dz=p.z-anchor.z;const len=Math.hypot(dx,dz);const max=1.05;f.x=anchor.x+dx*Math.min(1,max/Math.max(.001,len));f.z=anchor.z+dz*Math.min(1,max/Math.max(.001,len));f.y=.28;dragSpeed=Math.min(1.5,dragSpeed*.65+Math.hypot(e.clientX-prevX,e.clientY-prevY)/75);prevX=e.clientX;prevY=e.clientY;}
function onUp(){if(!dragging||ended)return;dragging=false;let f=feet[active];f.y=.09;const anchor=feet[1-active];const span=Math.hypot(f.x-anchor.x,f.z-anchor.z);const crossing=(active===0?f.x>anchor.x+.08:f.x<anchor.x-.08);const strain=Math.max(0,span-.53)*48+(crossing?23:0)+dragSpeed*10;stability=Math.max(0,stability-strain);if(Math.abs(f.x)>.135){finish(false,'白線を踏み外した！');return}if(stability<=12){finish(false,'バランスを崩して転落した！');return}progress=Math.max(progress,-Math.min(feet[0].z,feet[1].z));if(progress>=12){finish(true,'12mの白線を渡りきった！');return}active=1-active;updateButtons();status.textContent=(active===0?'左足':'右足')+'をドラッグして次の一歩へ'}
renderer.domElement.addEventListener('pointerdown',onDown);renderer.domElement.addEventListener('pointermove',onMove);renderer.domElement.addEventListener('pointerup',onUp);renderer.domElement.addEventListener('pointercancel',onUp);
document.getElementById('view').onclick=()=>{if(ended)return;look=!look;dragging=false;document.getElementById('view').textContent=look?'足元に戻る':'前方を見る';status.textContent=look?'前方を確認中':'足をドラッグして進もう'};document.getElementById('reset').onclick=reset;document.getElementById('retry').onclick=reset;
document.getElementById('left').onclick=()=>{if(!dragging&&!ended){active=0;updateButtons()}};document.getElementById('right').onclick=()=>{if(!dragging&&!ended){active=1;updateButtons()}};
function animate(){requestAnimationFrame(animate);const hip=new THREE.Vector3((feet[0].x+feet[1].x)/2,1.06,(feet[0].z+feet[1].z)/2+.15);if(ended&&document.getElementById('result').textContent==='GAME OVER'){velocity+=.006;fallY-=velocity}const tilt=(feet[0].x+feet[1].x)*.3+(100-stability)*.002;const desired=new THREE.Vector3(hip.x+tilt,look?1.72:1.58,hip.z+(look?.5:1.0));desired.y+=fallY;camera.position.lerp(desired,.1);const aim=look?new THREE.Vector3(hip.x,1.45,hip.z-10):new THREE.Vector3(hip.x,0,hip.z-.65);aim.y+=fallY;camera.lookAt(aim);
for(let i=0;i<2;i++){footMeshes[i].position.copy(feet[i]);footMeshes[i].position.y+=fallY;const knee=new THREE.Vector3((hip.x+feet[i].x)/2+(i? .07:-.07),.58+fallY,(hip.z+feet[i].z)/2-.06);const ankle=feet[i].clone();ankle.y+=fallY+.12;const mid=knee.clone().add(ankle).multiplyScalar(.5);legs[i].position.copy(mid);const delta=knee.clone().sub(ankle);legs[i].scale.set(1,delta.length(),1);legs[i].quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),delta.normalize())}
// Gradual instability: planted foot slips if strained, rather than random drift.
if(dragging&&!ended){const f=feet[active],a=feet[1-active];const span=Math.hypot(f.x-a.x,f.z-a.z);const excess=Math.max(0,span-.78);stability=Math.max(0,stability-excess*.3-dragSpeed*.015);if(excess>.12){a.x+=(f.x-a.x)*.0007;a.z+=(f.z-a.z)*.0007}if(Math.abs(a.x)>.135||stability<=12)finish(false,'軸足が滑り、バランスを失った！')}
if(!dragging&&!ended)stability=Math.min(100,stability+.012);document.getElementById('balanceText').textContent=Math.round(stability)+'%';document.getElementById('fill').style.width=stability+'%';document.getElementById('fill').style.background=stability<35?'#f16e6e':stability<65?'#edbf62':'#69dfaa';document.getElementById('distance').textContent='進行距離 '+progress.toFixed(1)+'m / 12m';renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});reset();animate();
</script></body></html>
